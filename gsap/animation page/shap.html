<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content dat scoort</title>

<style>
    body {
        margin: 0;
        font-family: "Inter", sans-serif;
        background: #f7efe6;
    }

    .container {
        max-width: 1200px;
        margin: auto;
        padding: 40px 20px;
    }

    h1 {
        font-size: 64px;
        font-weight: 800;
        margin: 0 0 20px 0;
    }

    p {
        max-width: 350px;
        font-size: 18px;
        line-height: 1.5;
        margin-bottom: 20px;
    }

    .btn {
        display: inline-flex;
        align-items: center;
        border: 1px solid #000;
        padding: 10px 16px;
        border-radius: 50px;
        cursor: pointer;
        font-size: 15px;
        background: #fff;
        transition: 0.3s;
    }

    .btn:hover {
        background: #000;
        color: #fff;
    }

    .btn span {
        margin-left: 6px;
        font-size: 18px;
    }

    /* Cards Area */
    .cards {
        margin-top: 40px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 40px;
    }

    /* Card Styles */
    .card {
        border-radius: 28px;
        position: relative;
        overflow: hidden;
        cursor: pointer;
        transition: transform .4s ease;
    }

    .card:hover {
        transform: translateY(-8px);
    }

    .card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    /* Card content text block */
    .card-content {
        position: absolute;
        bottom: 0;
        padding: 20px;
        padding-bottom: 30px;
        border-radius: 20px;
        color: #fff;
        width: calc(100% - 40px);
    }

    .tag {
        margin-top: 6px;
        display: inline-block;
        padding: 4px 10px;
        background: rgba(255,255,255,0.3);
        color: #fff;
        font-size: 13px;
        border-radius: 6px;
    }

    .arrow {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 40px;
        height: 40px;
        background: #fff;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
    }

    /* Card specific backgrounds */
    .c1 { background: #ff3b00; color: #fff; }
    .c2 { border: 4px solid #006cff; }
    .c3 { border: 4px solid #32c383; }

    /* Text overlay colors per card */
    .c2 .card-content { background: #007aff; }
    .c3 .card-content { background: #32c383; }
</style>
</head>

<body>

<div class="container">

    <h1>Content dat scoort.</h1>

    <p>
        Wij vertellen jouw verhaal. Op een manier die écht past bij jouw doelgroep.
        Met creatieve content die werkt en het verschil maakt.
    </p>

    <button class="btn">Bekijk al ons werk <span>→</span></button>

    <!-- Cards Section -->
    <div class="cards">

        <!-- Card 1 -->
        <div class="card c1">
            <div class="arrow">→</div>
            <div class="card-content">
                <h3>Van nul naar vol,<br>binnen 3 weken</h3>
                <span class="tag">Bullit</span>
            </div>
        </div>

        <!-- Card 2 -->
        <div class="card c2">
            <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=800&q=60">
            <div class="arrow">→</div>
            <div class="card-content">
                <h3>Zacht in smaak,<br>sterk in beeld</h3>
                <span class="tag">Roasta</span>
            </div>
        </div>

        <!-- Card 3 -->
        <div class="card c3">
            <img src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?auto=format&fit=crop&w=800&q=60">
            <div class="arrow">→</div>
            <div class="card-content">
                <h3>Content die écht<br>smaakt (en raakt)</h3>
                <span class="tag">Loco</span>
            </div>
        </div>

    </div>
</div>

</body>
</html>
