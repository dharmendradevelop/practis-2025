<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation FROM</title>
    <style>
        body{
            overflow-x: hidden;
        }
        .prtdiv{
           background: rgba(255, 0, 0, 0);
            padding: 10px;
            display: flex;
            justify-content: center;
        }
        .box1,.box2{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            padding: 10px;
            border: 2px solid #ee3;
            color: #000;
            display: flex;
            justify-content: center;
            align-items: center;

        }
    .box1{
        background: rgb(166, 89, 237);
    }
    .box2{
        background: green;
    }
    </style>
</head>
<body>
    <div class="prtdiv">
        <div class="box1">box 1</div>
        <div class="box2">box 2</div> 
    </div>
   
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.4/gsap.min.js"></script>
<script>
 
  gsap.from("body .box1", {
    duration: 3,
     x:'-300px',
     textTransform:'uppercase',
     rotate:360,
     delay:1,
     });

    gsap.from("body .box2", {
    duration: 3,
     x:'300px',
     textTransform: 'uppercase',
     rotate:-360,
     delay:1,
     });

</script>
</body>
</html>
