<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GSAP Fade + Scale + Layered Parallax</title>

<!-- GSAP + ScrollTrigger -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: #111;
}

.wrapper {
    height: 100vh;           /* scroll container */
    overflow-y: scroll;
}

/* Main section */
section {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;

    opacity: 0;              /* fade-in */
    transform: translateY(80px) scale(0.9); /* start down + small */
    will-change: transform, opacity;
}

/* Background layer */
.bg-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    z-index: 1;
}

/* Content layer */
.content-layer {
    position: relative;
    z-index: 2;
    color: #fff;
    font-size: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Colors for demo */
section:nth-child(1) .bg-layer { background: #e74c3c; }
section:nth-child(2) .bg-layer { background: #3498db; }
section:nth-child(3) .bg-layer { background: #2ecc71; }
section:nth-child(4) .bg-layer { background: #9b59b6; }

</style>
</head>
<body>

<div class="wrapper">
    <section class="parallax-sec">
        <div class="bg-layer"></div>
        <div class="content-layer"><h1>rtrtrttr</h1></div>
    </section>
    <section class="parallax-sec">
        <div class="bg-layer"></div>
        <div class="content-layer"><h1>rtrtrttr ehefewgh</h1></div>
    </section>
    <section class="parallax-sec">
        <div class="bg-layer"></div>
        <div class="content-layer"><h1>rtrtrttr cccccccdfrrrrr</h1></div>
    </section>
    <section class="parallax-sec">
        <div class="bg-layer"></div>
        <div class="content-layer"><h1>rtrtrttrkjjjjjjjjjjjjjj</h1></div>
    </section>
</div>

<script>
gsap.registerPlugin(ScrollTrigger);

const wrapper = document.querySelector(".wrapper");

gsap.utils.toArray(".parallax-sec").forEach((sec, i) => {

    const content = sec.querySelector(".content-layer");
    const bg = sec.querySelector(".bg-layer");

    const baseSpeed = 0.3 + i * 0.15;

    // --- Main Parallax: Section move ---
    gsap.to(sec, {
        y: () => -(wrapper.scrollTop * baseSpeed),
        ease: "none",
        scrollTrigger: {
            trigger: wrapper,
            start: "top top",
            end: "bottom bottom",
            scrub: 1,
            scroller: wrapper
        }
    });

    // --- Background Layer Parallax ---
    gsap.to(bg, {
        y: () => -(wrapper.scrollTop * (baseSpeed + 0.2)), // slightly faster
        ease: "none",
        scrollTrigger: {
            trigger: wrapper,
            start: "top top",
            end: "bottom bottom",
            scrub: 1,
            scroller: wrapper
        }
    });

    // --- Content Layer Parallax ---
    gsap.to(content, {
        y: () => -(wrapper.scrollTop * (baseSpeed - 0.1)), // slightly slower
        ease: "none",
        scrollTrigger: {
            trigger: wrapper,
            start: "top top",
            end: "bottom bottom",
            scrub: 1,
            scroller: wrapper
        }
    });

    // --- Fade + Scale Animation ---
    gsap.to(sec, {
        opacity: 1,
        y: 0,
        scale: 1,
        duration: 1.4,
        ease: "power3.out",
        scrollTrigger: {
            trigger: sec,
            start: "top 80%",
            end: "top 40%",
            scrub: false,
            scroller: wrapper
        }
    });

});
</script>

</body>
</html>
