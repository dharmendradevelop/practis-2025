<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GSAP Vertical Parallax</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      font-family: Arial;
    }

    section {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 50px;
      color: #fff;
      position: relative;
      z-index: 2;
    }

    /* Background layers */
    .parallax-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* Foreground image */
    .parallax-fg {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: auto;
      z-index: 3;
      pointer-events: none;
    }
  </style>
</head>
<body>

<img src="https://picsum.photos/1920/1080?random=10" class="parallax-bg" id="bg">

<section style="background:#0003;">Section 1</section>
<section style="background:#0003;">Section 2</section>
<section style="background:#0003;">Section 3</section>

<img src="https://picsum.photos/800/600?random=20"
     class="parallax-fg"
     id="fg">

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<script>
gsap.registerPlugin(ScrollTrigger);

// Parallax background (slow)
gsap.to("#bg", {
  y: -200,
  ease: "none",
  scrollTrigger: {
    trigger: "body",
    start: "top top",
    end: "bottom bottom",
    scrub: true
  }
});

// Parallax foreground (fast)
gsap.to("#fg", {
  y: -400,
  ease: "none",
  scrollTrigger: {
    trigger: "body",
    start: "top top",
    end: "bottom bottom",
    scrub: true
  }
});
</script>

</body>
</html>
