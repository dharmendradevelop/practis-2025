<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regular expression</title>
</head>
<body>
<input type="text" name="text_t" value="" id="sts" onkeydown="srt();"/>
<p id="demo"></p>

<script>

function srt(){
let s= document.getElementById("sts").value;
// alert(s);
if(s.match()){
return document.getElementById("demo").innerHTML = s;
}
}

</script>
</body>
</html>
