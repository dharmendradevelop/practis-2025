<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<div class="rem_days"> Remaining days for the fair: <span id="countdown" style="font-weight: 700;"></span></div>
<script>
      // Set the date and time to count down to
  const countdownDate = new Date("December 31, 2024 23:59:59").getTime();

// Update the countdown every second
const x = setInterval(function() {
  const now = new Date().getTime();
  const distance = countdownDate - now;

  // Calculate days, hours, minutes, and seconds
  const days = Math.floor(distance / (1000 * 60 * 60 * 24));
  const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
  const seconds = Math.floor((distance % (1000 * 60)) / 1000);

  // Display the result
  document.getElementById("countdown").innerHTML =
    days + "Day " + hours + "Hours " + minutes + "Minutes " + seconds + "Seconds ";

  // If the countdown is finished, display a message
  if (distance < 0) {
    clearInterval(x);
    document.getElementById("countdown").innerHTML = "Remaining days for the fair Expire";
  }
}, 1000);

</script>    
</body>
</html>
